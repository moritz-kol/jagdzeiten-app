<title>Jagdzeiten</title>
<style>

@media(prefers-color-scheme:dark){:root{--bg:#1c2219;--card:#262e22;--ink:#e6eadf;--mute:#9aa690;--lod:#2c3a22;--line:#3a4533}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--lod);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5}
h1{font:600 20px Georgia,serif;margin:0;flex:1}
.dj{background:var(--or);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;display:none}
body.dj-on .dj{display:inline}
button,select,input[type=text]{font:inherit;color:inherit}
#burger{background:none;border:0;color:#fff;font-size:26px;padding:0 4px}
#menu{display:none;background:var(--card);border-bottom:2px solid var(--or);padding:12px 14px;position:sticky;top:52px;z-index:4}
#menu.open{display:block}
#menu label{display:flex;gap:10px;align-items:center;font-weight:600}
#menu p{color:var(--mute);font-size:14px;margin:6px 0 10px}
.btn{background:var(--lod);color:#fff;border:0;border-radius:8px;padding:8px 12px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
nav{display:flex;overflow-x:auto;gap:6px;padding:10px 12px 4px}
nav button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
nav button.on{background:var(--lod);color:#fff;border-color:var(--lod)}
nav .djtab{display:none}body.dj-on nav .djtab{display:block}
main{padding:8px 12px 24px;max-width:640px;margin:0 auto}
.art{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:4px 12px 8px}
.art h2{font:600 18px Georgia,serif;margin:8px 0 2px;display:flex;align-items:center;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{font-weight:600}
.row.off b,.art.off h2 span{color:var(--mute);opacity:.75}
.row.off b{font-weight:500}.row small{color:var(--mute)}
.chip{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--line);color:var(--mute)}
.chip.o{background:var(--ok);color:#fff}
.bar{grid-column:2/4;display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.bar i{height:6px;border-radius:2px;background:var(--line)}.bar i.o{background:var(--ok)}
.art input{width:22px;height:22px;accent-color:var(--or);display:none}
body.dj-on .art input{display:block}
body:not(.dj-on) .row{grid-template-columns:1fr auto}
body:not(.dj-on) .bar{grid-column:1/3}
main.ro .art input,main.ro .row>span:first-child,body:not(.dj-on) .row>span:first-child{display:none}
body.dj-on main.ro .row{grid-template-columns:1fr auto}
body.dj-on main.ro .bar{grid-column:1/3}
.note{font-size:13px;color:var(--mute);margin:12px 2px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ctl select,.ctl input{flex:1;min-width:120px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
svg{width:100%;touch-action:manipulation;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cols{display:flex;gap:8px;margin:8px 0}.cols button{flex:1;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:10px 4px;display:flex;gap:8px;align-items:center;justify-content:center}.cols button.on{border-color:var(--ink);font-weight:600}.cols i{width:16px;height:16px;border-radius:50%;display:inline-block}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:8px 12px}.it summary{cursor:pointer}.it i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.it a{color:inherit;font-weight:600}.it p{margin:6px 0}#lst{width:100%;margin-top:6px}
.nb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:1px 8px;margin-left:8px;font:400 13px system-ui,sans-serif;color:inherit}.nt{display:block;color:var(--ink);font-size:14px;margin:2px 0 4px}
.empty{color:var(--mute);padding:20px 4px}

  let bar="";for(let m=1;m<=12;m++)bar+=`<i class="${!lock&&inAny(s,m*100+15)?"o":""}"></i>`;
  const cb=w.r.length>1?`<input type="checkbox" data-k="${esc(k)}" ${S.free[k]?"checked":""} aria-label="${esc(w.n+" "+l)} freigegeben">`:"<span></span>";
  return `<div class="row${open?"":" off"}">${cb}<div><b>${esc(l)}</b> <small>${fmt(s)}</small>${S.tab==="free"?nbtn(k):""}${note?`<br><small>${esc(note)}</small>`:""}${S.tab==="free"&&S.notes[k]?`<span class="nt">📝 ${esc(S.notes[k])}</span>`:""}</div><span class="chip ${open?"o":""}">${open?"jagbar":"Schonzeit"}</span><div class="bar">${bar}</div></div>`;
}
const rOpen=([l,s,n,u])=>!(u&&now<=new Date(u+"T23:59:59"))&&inAny(s,today);
const srt=l=>[...l].sort((a,b)=>b.r.some(rOpen)-a.r.some(rOpen));
const nbtn=k=>`<button class="nb" data-nk="${esc(k)}">✎ Notiz</button>`;
const art=w=>`<section class="art${w.r.some(rOpen)?"":" off"}"><h2><input type="checkbox" class="sp" data-s="${esc(w.n)}" aria-label="${esc(w.n)} komplett freigeben"><span>${esc(w.n)}</span>${S.tab==="free"?nbtn(w.n):""}</h2>${S.tab==="free"&&S.notes[w.n]?`<span class="nt">📝 ${esc(S.notes[w.n])}</span>`:""}${[...w.r].sort((a,b)=>rOpen(b)-rOpen(a)).map(r=>row(w,r)).join("")}</section>`;
const note=()=>`<p class="note">${NOTES[S.land]||"Ohne Gewähr. Maßgeblich ist immer die gültige Landesjagdzeitenverordnung."}</p>`;
function render(){
  document.body.classList.toggle("dj-on",S.dj);$("djToggle").checked=S.dj;
  if(!S.dj&&(S.tab==="free"||S.tab==="book"))S.tab="nh";
  $("tabs").innerHTML=TABS.map(([id,t,x])=>`<button data-t="${id}" class="${x?"djtab ":""}${S.tab===id?"on":""}">${t}</button>`).join("");
  const v=$("view");v.classList.toggle("ro",S.tab==="free");
  const L=LAENDER.find(l=>l[0]===S.land);$("ttl").textContent=document.title="Jagdzeiten "+L[2];
  if(!D.length&&S.tab!=="book"){v.innerHTML=`<p class="empty">Für ${L[1]} sind noch keine Jagdzeiten hinterlegt. Sie werden Bundesland für Bundesland nach dem jeweiligen Landesjagdgesetz bzw. der Landesjagdzeitenverordnung ergänzt.</p>`;return}
  if(S.tab==="book")return book(v);
  if(S.tab==="free"){
    const l=D.map(w=>({...w,r:w.r.filter(r=>S.free[key(w.n,r[0])])})).filter(w=>w.r.length);
    v.innerHTML=l.length?srt(l).map(art).join("")+note():`<p class="empty">Noch nichts freigegeben. Hake in den Wildart-Tabs an, welche Wildarten und Klassen bei der Ansprache freigegeben werden.</p>`;
  }else v.innerHTML=srt(D.filter(w=>w.g===S.tab)).map(art).join("")+note();
  const sync=()=>v.querySelectorAll("input.sp").forEach(i=>{const w=D.find(x=>x.n===i.dataset.s),c=w.r.filter(r=>S.free[key(w.n,r[0])]).length;i.checked=c===w.r.length;i.indeterminate=c>0&&c<w.r.length});
  sync();
  v.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{i.checked?S.free[i.dataset.k]=1:delete S.free[i.dataset.k];save();S.tab==="free"?render():sync()});
  v.querySelectorAll("[data-nk]").forEach(b=>b.onclick=()=>{const k=b.dataset.nk,t=prompt("Notiz zu "+k.replace("|"," – ")+" (leer = löschen)",S.notes[k]||"");if(t===null)return;const x=t.trim();x?S.notes[k]=x:delete S.notes[k];save();render()});
  v.querySelectorAll("input.sp").forEach(i=>i.onchange=()=>{const w=D.find(x=>x.n===i.dataset.s);w.r.forEach(r=>{const k=key(w.n,r[0]);i.checked?S.free[k]=1:delete S.free[k]});save();render()});
}
// ===== Notizbuch =====
let hd=S.hd||0,samples=[],tmr;
const M=1.5; // Meter pro Plan-Einheit (Ring 100 = 150 m)
const ll=(x,y)=>S.pos?{lat:S.pos.lat-y*M/111320,lon:S.pos.lon+x*M/(111320*Math.cos(S.pos.lat*Math.PI/180))}:null;
const f6=n=>n.toFixed(6),gm=(a,o)=>`https://www.google.com/maps?q=${f6(a)},${f6(o)}`;
function plan(){
  let g=`<g transform="rotate(${-hd})">`;
  [33,66,100].forEach((r,i)=>g+=`<circle r="${r}" fill="none" stroke="var(--line)" stroke-width="1"/><text transform="rotate(${hd} ${r-3} -2)" x="${r-3}" y="-2" text-anchor="end" font-size="6" fill="var(--mute)">${50*(i+1)} m</text>`);
  g+=`<path d="M-100 0H100M0-100V100" stroke="var(--line)" stroke-width=".6"/><text transform="rotate(${hd} 0 -90)" x="0" y="-87" text-anchor="middle" font-size="10" font-weight="700" fill="var(--or)">N</text>`;
  S.marks.forEach((m,i)=>g+=`<circle cx="${m.x}" cy="${m.y}" r="4" fill="${(COL[m.c]||["#f26a1b"])[0]}" stroke="var(--ink)" stroke-width=".8"/><text transform="rotate(${hd} ${m.x} ${m.y})" x="${m.x+5}" y="${m.y+2}" font-size="6.5" fill="var(--ink)">${i+1} ${esc(m.w)}${m.t?": "+esc(m.t):""}</text>`);
  return g+`</g><path d="M0-7L6 5H-6Z" fill="var(--lod)"/><text y="16" font-size="6" text-anchor="middle" fill="var(--ink)">Stand</text>`;
}
const info=t=>{const e=$("gpsinfo");if(e)e.textContent=t};
const gpsInfo=()=>info(S.pos?`Stand: ${f6(S.pos.lat)}, ${f6(S.pos.lon)} (±${S.pos.acc} m)`:"Noch kein Standort abgerufen.");
function onO(e){
  const h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null&&(e.absolute||e.type==="deviceorientationabsolute")?360-e.alpha:null);
  if(h!=null)samples.push(h);
}
const stopL=()=>{removeEventListener("deviceorientationabsolute",onO,true);removeEventListener("deviceorientation",onO,true)};
function listHtml(){
  if(!S.list)return"";
  const t=ts=>ts?" · "+new Date(ts).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";
  const det=(la,lo)=>`<p>${f6(la)}, ${f6(lo)} <button class="btn alt" data-cp="${f6(la)}, ${f6(lo)}">Kopieren</button></p><p><a href="${gm(la,lo)}" target="_blank" rel="noopener">In Google Maps öffnen</a></p>`;
  let h=S.pos?`<details class="it"><summary><i style="background:var(--lod)"></i>Stand</summary>${det(S.pos.lat,S.pos.lon)}</details>`:"";
  h+=S.marks.map((m,i)=>{const c=COL[m.c]||["#f26a1b","Markierung"];
    return `<details class="it"><summary><i style="background:${c[0]}"></i>${i+1} · ${esc(m.w)} <small>${c[1]}${t(m.ts)}</small></summary>${m.lat!=null?det(m.lat,m.lon):"<p>Ohne GPS-Standort markiert – keine Koordinaten.</p>"}${m.t?`<p>${esc(m.t)}</p>`:""}</details>`}).join("");
  return h||`<p class="empty">Noch keine Markierungen.</p>`;
}
function book(v){
  const opts=[...Object.keys(S.free).map(k=>k.replace("|"," – ")),"Sonstiges"].map(n=>`<option>${esc(n)}</option>`).join("");
  v.innerHTML=`<p class="note">Rufe zuerst deinen Standort ab, dann wähle Wildart und Farbe und tippe auf die Stelle im Plan. Ringe = 50/100/150 m. Mit „Norden ausrichten“ hältst du das Handy flach, Oberkante in Blickrichtung: Der Plan dreht sich dabei einmalig so, dass N nach Norden zeigt und oben deine Blickrichtung ist.</p>
  <div class="ctl"><button class="btn" id="gps">Standort abrufen</button><button class="btn alt" id="cmp">${hd?"Norden neu ausrichten":"Norden ausrichten"}</button>${hd?`<button class="btn alt" id="rst">Zurücksetzen</button>`:""}</div>
  <p class="note" id="gpsinfo"></p>
  <div class="ctl"><select id="bw">${opts}</select></div>
  <div class="cols">${Object.entries(COL).map(([c,[h,n]])=>`<button data-c="${c}" class="${S.col===c?"on":""}"><i style="background:${h}"></i>${n}</button>`).join("")}</div>
  <svg id="sv" viewBox="-105 -105 210 210">${plan()}</svg>
  <div class="ctl"><button class="btn alt" id="undo">Letzte entfernen</button><button class="btn alt" id="clr">Alle löschen</button></div>
  <button class="btn alt" id="lst">${S.list?"Liste ausblenden":`Markierungen anzeigen (${S.marks.length})`}</button><div id="list">${listHtml()}</div>`;
  gpsInfo();
  const again=()=>{const w=$("bw").value;book(v);$("bw").value=w};
  $("gps").onclick=()=>{
    if(!navigator.geolocation)return info("GPS wird von diesem Gerät/Browser nicht unterstützt.");
    info("Suche Standort …");
    navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)};save();gpsInfo();if(S.list)again()},()=>info("Standort nicht verfügbar – Freigabe und GPS prüfen."),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  };
  $("cmp").onclick=async()=>{
    try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
    samples=[];clearTimeout(tmr);info("Handy ruhig halten – misst 1–2 Sekunden …");
    addEventListener("deviceorientationabsolute",onO,true);addEventListener("deviceorientation",onO,true);
    tmr=setTimeout(()=>{
      stopL();
      if(!samples.length)return info("Kein Kompass-Signal – Sensor/Freigabe prüfen.");
      const r=samples.reduce((q,h)=>[q[0]+Math.sin(h*Math.PI/180),q[1]+Math.cos(h*Math.PI/180)],[0,0]);
      hd=S.hd=Math.round((Math.atan2(r[0],r[1])*180/Math.PI+360)%360)||0;save();
      if(S.tab==="book")again();
    },1500);
  };
  if($("rst"))$("rst").onclick=()=>{hd=S.hd=0;save();again()};
  v.querySelectorAll(".cols button").forEach(b=>b.onclick=()=>{S.col=b.dataset.c;save();again()});
  $("sv").onclick=e=>{
    const r=e.currentTarget.getBoundingClientRect(),k=210/r.width,sx=(e.clientX-r.left)*k-105,sy=(e.clientY-r.top)*k-105,a=hd*Math.PI/180;
    const x=Math.round((sx*Math.cos(a)-sy*Math.sin(a))*10)/10,y=Math.round((sx*Math.sin(a)+sy*Math.cos(a))*10)/10,c=ll(x,y);
    S.marks.push({x,y,w:$("bw").value,c:S.col,ts:Date.now(),...(c?{lat:c.lat,lon:c.lon}:{})});save();again();
  };
  $("undo").onclick=()=>{S.marks.pop();save();again()};
  $("clr").onclick=()=>{if(confirm("Alle Markierungen löschen?")){S.marks=[];save();again()}};
  $("lst").onclick=()=>{S.list=!S.list;save();again()};
  v.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.cp);b.textContent="Kopiert"}catch(e){}});
}
// ===== Events =====
$("land").innerHTML=LAENDER.map(([i,n])=>`<option value="${i}">${n}${DATA[i]?"":" (noch ohne Daten)"}</option>`).join("");$("land").value=S.land;
$("land").onchange=e=>{S.land=e.target.value;D=DATA[S.land]||[];save();$("menu").classList.remove("open");render()};
$("burger").onclick=()=>$("menu").classList.toggle("open");
$("djToggle").onchange=e=>{S.dj=e.target.checked;save();render()};
$("resetFree").onclick=()=>{if(confirm("Alle Freigaben und Notizen zurücksetzen?")){S.free={};S.notes={};save();render()}};
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;save();render()}};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
